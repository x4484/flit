name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to package
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    environment: release
    env:
      NOTARYTOOL_PROFILE: flit-release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          [[ "$TAG" == v* ]]
          git rev-parse "$TAG" >/dev/null
          echo "FLIT_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          : "${CERTIFICATE_BASE64:?Missing DEVELOPER_ID_CERTIFICATE_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing DEVELOPER_ID_CERTIFICATE_PASSWORD}"
          KEYCHAIN="$RUNNER_TEMP/flit-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          : "${IDENTITY:?No Developer ID Application identity found}"
          echo "DEVELOPER_ID_APPLICATION=$IDENTITY" >> "$GITHUB_ENV"

      - name: Configure Apple notarization
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
        run: |
          : "${APPLE_KEY_ID:?Missing APPLE_KEY_ID}"
          : "${APPLE_ISSUER_ID:?Missing APPLE_ISSUER_ID}"
          : "${APPLE_PRIVATE_KEY_BASE64:?Missing APPLE_PRIVATE_KEY_BASE64}"
          echo "$APPLE_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_KEY_ID" \
            --issuer "$APPLE_ISSUER_ID"

      - name: Install approved Google OAuth configuration
        env:
          GOOGLE_OAUTH_JSON_BASE64: ${{ secrets.GOOGLE_OAUTH_JSON_BASE64 }}
        run: |
          : "${GOOGLE_OAUTH_JSON_BASE64:?Missing GOOGLE_OAUTH_JSON_BASE64}"
          echo "$GOOGLE_OAUTH_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/GoogleOAuth.json"
          chmod 600 "$RUNNER_TEMP/GoogleOAuth.json"
          python3 - "$RUNNER_TEMP/GoogleOAuth.json" <<'PY'
          import json
          import pathlib
          import sys

          installed = json.loads(pathlib.Path(sys.argv[1]).read_text())["installed"]
          required = {"client_id", "client_secret", "auth_uri", "token_uri", "redirect_uris"}
          missing = sorted(key for key in required if not installed.get(key))
          if missing:
              raise SystemExit(f"OAuth JSON is missing required fields: {', '.join(missing)}")
          PY
          echo "FLIT_GOOGLE_OAUTH_CONFIG=$RUNNER_TEMP/GoogleOAuth.json" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build, sign, notarize, and package
        run: ./scripts/package-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flit-${{ env.FLIT_RELEASE_TAG }}
          path: dist/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --title "Flit ${FLIT_RELEASE_TAG#v}" --generate-notes)
          if [[ "$FLIT_RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$FLIT_RELEASE_TAG" dist/release/* "${args[@]}"
